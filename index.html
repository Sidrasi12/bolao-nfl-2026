<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#071b14"
  >

  <title>Bolão NFL 2026</title>

  css/style.css

  <script
    defer
    src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js">
  </script>

  <script
    defer
    src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js">
  </script>

  <script
    defer
    src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js">
  </script>
</head>

<body>
  <div
    id="toast"
    class="toast">
  </div>

  <section
    id="auth-view"
    class="auth-shell">

    <div class="auth-card">
      <div class="ball">🏈</div>

      <h1>
        Bolão NFL
        <span>2026</span>
      </h1>

      <p>
        Palpites, ranking e resenha em um só lugar.
      </p>

      <form id="login-form">
        <label>
          E-mail

          <input
            id="email"
            type="email"
            autocomplete="email"
            required
          >
        </label>

        <label>
          Senha

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            minlength="6"
            required
          >
        </label>

        <button type="submit">
          Entrar
        </button>
      </form>

      <div class="auth-actions">
        <button
          id="register-btn"
          class="secondary"
          type="button">
          Criar conta
        </button>
      </div>

      <small>
        Uso privado entre participantes cadastrados.
      </small>
    </div>
  </section>

  <div
    id="app"
    class="hidden">

    <header>
      <button
        id="menu-btn"
        class="icon-btn"
        type="button"
        aria-label="Abrir menu">
        ☰
      </button>

      <div class="brand">
        🏈
        <b>Bolão NFL</b>
        <span>2026</span>
      </div>

      <div class="user">
        <span id="user-name"></span>

        <button
          id="logout-btn"
          class="secondary compact"
          type="button">
          Sair
        </button>
      </div>
    </header>

    <aside id="sidebar">
      <nav>
        <button
          class="active"
          data-page="dashboard"
          type="button">
          ⌂ Início
        </button>

        <button
          data-page="weekly"
          type="button">
          ✓ Palpites
